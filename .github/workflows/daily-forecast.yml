name: 한반도 일일 예보

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 UTC 21:17 = 한국시간 06:17
  workflow_dispatch:        # Actions 탭의 "Run workflow" 버튼으로 수동 실행
  push:
    paths:
      - "daily_forecast/**"
      - ".github/workflows/daily-forecast.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-forecast
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: daily_forecast/   # 큰 GloSea6 자료는 받지 않음
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: daily_forecast/requirements.txt

      - name: 한글 글꼴 설치
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-nanum

      - name: 해안선 자료 캐시
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-naturalearth-50m

      - run: pip install -r daily_forecast/requirements.txt

      - name: 예보 받아서 그림·페이지 생성
        run: python daily_forecast/forecast.py --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # main 브랜치에서만 게시 (다른 브랜치는 생성 확인만)
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
